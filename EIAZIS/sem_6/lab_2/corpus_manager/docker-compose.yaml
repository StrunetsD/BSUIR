version: '3.8'

services:
  db:
    image: postgres:12
    container_name: corpus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: corpus_user
      POSTGRES_PASSWORD: corpus_pass
      POSTGRES_DB: corpus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpus_user -d corpus_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - corpus_network

  web:
    build: .
    container_name: corpus_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://corpus_user:corpus_pass@db:5432/corpus_db
    ports:
      - "5001:5000"  
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    command: >
      sh -c "python -c 'from app import app, db; app.app_context().push(); db.create_all()' &&
             python app.py"
    networks:
      - corpus_network

volumes:
  postgres_data:

networks:
  corpus_network:
    driver: bridge
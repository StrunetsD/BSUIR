# Ollama на хосте (ollama.com): backend в Docker обращается к host.docker.internal:11434.
# Запуск/останов Ollama — вручную в терминале (см. README).

services:
  db:
    image: postgres:16-alpine
    container_name: lab6_postgres
    environment:
      POSTGRES_DB: literature_lab6
      POSTGRES_USER: literature
      POSTGRES_PASSWORD: literature
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U literature -d literature_lab6"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: lab6_backend
    environment:
      DATABASE_URL: postgresql://literature:literature@db:5432/literature_lab6
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: literature_chunks
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_CHAT_MODEL: qwen2.5:7b-instruct
      OLLAMA_EMBED_MODEL: nomic-embed-text
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "5001:5000"

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: lab6_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  frontend:
    build:
      context: ./project
    container_name: lab6_frontend
    depends_on:
      - backend
    ports:
      - "5174:5173"

volumes:
  pg_data:
  qdrant_data:
